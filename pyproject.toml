[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-security-scanner"
version = "2.1.0"
description = "AI-powered web crawler and penetration-testing scanner with a rule-based no-AI fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zarar Ahmed" }]
keywords = ["security", "pentest", "web-crawler", "vulnerability-scanner"]

# Core dependencies — required for the scanner to run in no-AI (rule-based) mode.
dependencies = [
    "requests>=2.31.0",
    "selenium>=4.15.0",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "webdriver-manager>=4.0.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "flask>=2.3.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
# AI providers — only needed when running with --ai.
ai = [
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
]
# Development / test tooling.
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
# Installs a `webscan` command that runs the scanner CLI.
webscan = "scanner.cli:main"

[tool.setuptools]
# Keep the thin root run.py shim so `python run.py <url>` keeps working.
py-modules = ["run"]

[tool.setuptools.packages.find]
include = ["scanner*", "intelligent_terminal_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
